# Runs the data scripts every morning and commits the fresh data,
# so the site updates itself. Can also be run by hand from the Actions tab
# ("Run workflow" button) thanks to workflow_dispatch.
#
# Every run writes logs/last_run.txt into the repo — if something breaks,
# the full story is readable right there, no log-spelunking needed.

name: Update bill data

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 6am Pacific (PDT)
  workflow_dispatch:        # adds a manual "Run workflow" button
  push:
    branches: [main]
    paths:                  # also refresh whenever the script itself changes
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write           # allows the workflow to commit to the repo

# If several runs get triggered back-to-back (e.g. a burst of commits),
# keep only the newest one instead of hammering the APIs in parallel.
concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Start the run log
        run: |
          mkdir -p logs
          echo "Run started $(date -u '+%Y-%m-%d %H:%M UTC')" > logs/last_run.txt

      - name: Fetch bills from Congress.gov
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: |
          set -o pipefail
          python scripts/fetch_bills.py 2>&1 | tee -a logs/last_run.txt

      - name: Fetch rules from the Federal Register
        run: |
          set -o pipefail
          python scripts/fetch_rules.py 2>&1 | tee -a logs/last_run.txt

      - name: Build the weekly digest
        run: |
          set -o pipefail
          python scripts/build_digest.py 2>&1 | tee -a logs/last_run.txt

      - name: Commit updated data (runs even if a step above failed)
        if: success() || failure()
        run: |
          git config user.name "docket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ logs/
          git diff --staged --quiet || git commit -m "Daily data refresh"
          # If someone pushed while we were running, rebase and try once more.
          git push || (git pull --rebase origin main && git push)
